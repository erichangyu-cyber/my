<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全班成绩总览</title>
    <style>
:root {
  --bg: #f7f9ff;
  --surface: #ffffff;
  --surface-soft: #f7f9fc;
  --surface-tint: #f0f6ff;
  --text: #111827;
  --muted: #667085;
  --line: #e3e8f0;
  --line-strong: #d7dee9;
  --blue: #3772ff;
  --blue-deep: #1d4ed8;
  --blue-soft: #eaf2ff;
  --teal: #00b8a9;
  --teal-soft: #ddfbf7;
  --pink: #ff4fa3;
  --pink-soft: #ffe8f3;
  --yellow: #ffd166;
  --yellow-soft: #fff6dc;
  --violet: #8b5cf6;
  --violet-soft: #f0eaff;
  --red: #ef4444;
  --red-soft: #ffecee;
  --green: #12a150;
  --green-soft: #e9fbef;
  --amber: #d97706;
  --shadow: 0 18px 50px rgba(25, 36, 64, 0.08);
  --shadow-soft: 0 8px 24px rgba(25, 36, 64, 0.06);
  --radius: 8px;
  --table-head-top: 78px;
  color-scheme: light;
  font-family: Inter, "SF Pro Display", "SF Pro Text", "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 8% 10%, rgba(255, 79, 163, 0.18) 0 18rem, transparent 18.5rem),
    radial-gradient(circle at 92% 12%, rgba(0, 184, 169, 0.16) 0 19rem, transparent 19.5rem),
    radial-gradient(circle at 82% 78%, rgba(139, 92, 246, 0.11) 0 24rem, transparent 24.5rem),
    linear-gradient(180deg, #fff9fd 0, var(--bg) 330px, #f8fbff 100%);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app-shell {
  min-height: 100vh;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.54), rgba(255, 255, 255, 0));
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid rgba(214, 224, 238, 0.72);
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(18px) saturate(1.16);
}

.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  width: min(1360px, calc(100% - 36px));
  margin: 0 auto;
  padding: 15px 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand-mark {
  display: grid;
  width: 38px;
  height: 38px;
  place-items: center;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--blue), var(--pink) 55%, var(--yellow));
  box-shadow: 0 10px 22px rgba(255, 79, 163, 0.22);
  color: #fff;
  font-weight: 900;
  letter-spacing: 0;
}

.brand h1 {
  margin: 0;
  font-size: 19px;
  line-height: 1.2;
  font-weight: 850;
}

.brand p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 12.5px;
}

.nav-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 10px;
}

.search,
.sort-select {
  width: 220px;
  height: 40px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--text);
  outline: none;
  padding: 0 12px;
  transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
}

.sort-select {
  width: auto;
  min-width: 150px;
  appearance: none;
}

.search:focus,
.sort-select:focus {
  border-color: rgba(37, 99, 235, 0.42);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.11);
}

.ghost-button {
  height: 40px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--text);
  padding: 0 14px;
  font-weight: 700;
  box-shadow: 0 1px 0 rgba(17, 24, 39, 0.03);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, color 0.16s ease;
}

.ghost-button:hover {
  border-color: rgba(37, 99, 235, 0.34);
  box-shadow: var(--shadow-soft);
  color: var(--blue-deep);
  transform: translateY(-1px);
}

.file-input {
  display: none;
}

.page {
  width: min(1360px, calc(100% - 36px));
  margin: 0 auto;
  padding: 30px 0 48px;
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.6fr);
  gap: 22px;
  align-items: stretch;
  margin-bottom: 22px;
}

.summary-panel,
.detail-panel,
.table-panel {
  border: 1px solid rgba(227, 232, 240, 0.72);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.96);
  box-shadow: var(--shadow);
}

.summary-panel {
  position: relative;
  overflow: hidden;
  padding: 26px;
}

.summary-panel::before,
.detail-panel::before,
.table-panel::before {
  content: "";
  display: block;
  height: 3px;
  margin: -1px -1px 0;
  background: linear-gradient(90deg, var(--blue), var(--pink), var(--yellow), var(--teal));
}

.summary-panel h2,
.detail-title h2 {
  margin: 0;
  font-size: 30px;
  line-height: 1.16;
  letter-spacing: 0;
  font-weight: 880;
}

.summary-panel p {
  max-width: 740px;
  margin: 10px 0 0;
  color: var(--muted);
  line-height: 1.75;
  font-size: 14.5px;
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 24px;
}

.metric {
  border: 1px solid var(--line);
  border-radius: 8px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.76)),
    linear-gradient(135deg, var(--blue-soft), var(--pink-soft));
  padding: 15px;
  box-shadow: 0 1px 0 rgba(17, 24, 39, 0.03);
}

.metric:nth-child(2) {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.75)),
    linear-gradient(135deg, var(--yellow-soft), var(--pink-soft));
}

.metric:nth-child(3) {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.75)),
    linear-gradient(135deg, var(--teal-soft), var(--blue-soft));
}

.metric:nth-child(4) {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.75)),
    linear-gradient(135deg, var(--violet-soft), var(--yellow-soft));
}

.metric span {
  display: block;
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 650;
}

.metric strong {
  display: block;
  margin-top: 7px;
  font-size: 26px;
  line-height: 1.15;
  font-weight: 900;
}

.rank-panel {
  padding: 20px;
}

.rank-panel h3,
.section-title h3 {
  margin: 0;
  font-size: 17px;
  font-weight: 850;
}

.rank-list {
  display: grid;
  gap: 10px;
  margin-top: 16px;
}

.rank-item {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 10px;
  align-items: center;
  border-radius: 8px;
  border: 1px solid rgba(227, 232, 240, 0.86);
  background: #fff;
  padding: 10px 11px;
  transition: transform 0.16s ease, box-shadow 0.16s ease;
}

.rank-item:hover {
  box-shadow: var(--shadow-soft);
  transform: translateY(-1px);
}

.rank-num {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border-radius: 8px;
  background: var(--surface-tint);
  color: var(--blue);
  font-weight: 900;
}

.rank-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 700;
}

.rank-score {
  color: var(--muted);
  font-size: 13px;
}

.section-title {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  margin: 26px 0 13px;
}

.section-title p {
  margin: 0;
  color: var(--muted);
  font-size: 13.5px;
}

.table-panel {
  position: relative;
  overflow: visible;
}

.table-scroll {
  overflow-x: auto;
  overflow-y: visible;
  position: relative;
  max-width: 100%;
  overscroll-behavior-x: contain;
  padding-bottom: 10px;
  scrollbar-color: rgba(55, 114, 255, 0.52) rgba(234, 242, 255, 0.95);
  scrollbar-width: thin;
}

.table-head-scroll {
  position: sticky;
  top: var(--table-head-top);
  z-index: 12;
  overflow: hidden;
  max-width: 100%;
  border-bottom: 1px solid var(--line);
  background: #f8fbff;
  box-shadow: 0 12px 24px rgba(25, 36, 64, 0.08);
}

.table-scroll::-webkit-scrollbar {
  height: 14px;
}

.table-scroll::-webkit-scrollbar-track {
  border-radius: 999px;
  background: rgba(234, 242, 255, 0.95);
}

.table-scroll::-webkit-scrollbar-thumb {
  border: 3px solid rgba(234, 242, 255, 0.95);
  border-radius: 999px;
  background: linear-gradient(90deg, var(--blue), var(--pink));
}

table {
  width: max-content;
  border-collapse: separate;
  border-spacing: 0;
  min-width: 1080px;
  table-layout: fixed;
}

th,
td {
  border-bottom: 1px solid var(--line);
  padding: 12px 10px;
  text-align: right;
  white-space: nowrap;
  font-size: 13.5px;
}

th {
  position: sticky;
  top: var(--table-head-top);
  z-index: 7;
  background: #f8fbff;
  color: #536074;
  font-weight: 780;
  vertical-align: top;
}

.head-table th {
  top: auto;
}

.body-head th {
  height: 0;
  border-bottom: 0;
  color: transparent;
  font-size: 0;
  line-height: 0;
  padding-bottom: 0;
  padding-top: 0;
}

.body-head .exam-name,
.body-head .median-badge {
  display: none;
}

th:nth-child(-n + 2),
td:nth-child(-n + 2) {
  position: sticky;
  z-index: 2;
  background: #fff;
}

th:nth-child(-n + 2) {
  z-index: 9;
  background: #f8fbff;
}

th:nth-child(1),
td:nth-child(1) {
  left: 0;
  width: 52px;
  min-width: 52px;
  max-width: 52px;
}

th:nth-child(2),
td:nth-child(2) {
  left: 52px;
  width: 100px;
  min-width: 100px;
  max-width: 100px;
  box-shadow: 12px 0 18px -18px rgba(25, 36, 64, 0.46);
}

th:nth-child(3),
td:nth-child(3) {
  width: 70px;
  min-width: 70px;
  max-width: 70px;
}

th:nth-child(4),
td:nth-child(4) {
  width: 70px;
  min-width: 70px;
  max-width: 70px;
}

tbody tr:hover td:nth-child(-n + 2) {
  background: #f9fcff;
}

.exam-head {
  width: 116px;
  min-width: 116px;
  max-width: 116px;
}

th:nth-child(n + 5),
td:nth-child(n + 5) {
  width: 116px;
  min-width: 116px;
  max-width: 116px;
}

.exam-name,
.median-badge {
  display: flex;
  justify-content: flex-end;
}

.exam-name {
  color: #253044;
  font-size: 13px;
  line-height: 1.2;
}

.median-badge {
  width: max-content;
  margin: 7px 0 0 auto;
  border-radius: 999px;
  background: var(--yellow-soft);
  color: #9a5b00;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 850;
}

th:first-child,
td:first-child,
th:nth-child(2),
td:nth-child(2) {
  text-align: left;
}

tbody tr {
  background: #fff;
  transition: background 0.16s ease, box-shadow 0.16s ease;
}

tbody tr:hover {
  background: #f9fcff;
  box-shadow: inset 3px 0 0 rgba(37, 99, 235, 0.54);
}

.student-link {
  border: 0;
  background: transparent;
  color: var(--blue);
  font-weight: 850;
  padding: 0;
  text-decoration: none;
  transition: color 0.16s ease;
}

.student-link:hover {
  color: var(--teal);
}

.pill {
  display: inline-flex;
  min-width: 46px;
  justify-content: center;
  border-radius: 999px;
  padding: 4px 9px;
  font-size: 12.5px;
  font-weight: 850;
}

.diff-positive {
  background: var(--red-soft);
  color: var(--red);
}

.diff-negative {
  background: var(--green-soft);
  color: var(--green);
}

.diff-zero {
  background: #f0f3f7;
  color: #5f6b7b;
}

.points {
  display: inline-flex;
  min-width: 34px;
  justify-content: center;
  border-radius: 8px;
  background: linear-gradient(180deg, var(--blue-soft), #dceaff);
  color: var(--blue-deep);
  padding: 6px 8px;
  font-weight: 900;
}

.muted {
  color: var(--muted);
}

.detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}

.detail-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 10px;
}

.detail-kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(180px, 1.2fr);
  gap: 12px;
  margin-bottom: 18px;
}

.detail-kpis div {
  border: 1px solid rgba(227, 232, 240, 0.72);
  border-radius: 8px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.76)),
    linear-gradient(135deg, var(--blue-soft), var(--teal-soft));
  padding: 13px 14px;
  box-shadow: var(--shadow-soft);
}

.detail-kpis div:nth-child(2) {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.76)),
    linear-gradient(135deg, var(--pink-soft), var(--yellow-soft));
}

.detail-kpis div:nth-child(3) {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.76)),
    linear-gradient(135deg, var(--violet-soft), var(--blue-soft));
}

.detail-kpis div:nth-child(4) {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.76)),
    linear-gradient(135deg, var(--teal-soft), var(--yellow-soft));
}

.detail-kpis span {
  display: block;
  color: var(--muted);
  font-size: 12px;
  font-weight: 750;
}

.detail-kpis strong {
  display: block;
  margin-top: 6px;
  overflow: hidden;
  color: var(--text);
  font-size: 22px;
  font-weight: 900;
  line-height: 1.15;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.detail-title p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 14.5px;
}

.back-button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 40px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--text);
  padding: 0 13px;
  font-weight: 750;
  transition: border-color 0.16s ease, box-shadow 0.16s ease, color 0.16s ease;
}

.back-button:hover {
  border-color: rgba(37, 99, 235, 0.34);
  box-shadow: var(--shadow-soft);
  color: var(--blue-deep);
}

.share-button {
  border-color: rgba(55, 114, 255, 0.28);
  background: linear-gradient(135deg, var(--blue), var(--pink));
  color: #fff;
  box-shadow: 0 12px 22px rgba(55, 114, 255, 0.18);
}

.share-button:hover {
  border-color: transparent;
  color: #fff;
  box-shadow: 0 15px 28px rgba(255, 79, 163, 0.22);
}

.share-button:disabled {
  cursor: wait;
  opacity: 0.72;
  transform: none;
}

.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 20;
  max-width: min(360px, calc(100% - 48px));
  border: 1px solid rgba(215, 222, 233, 0.88);
  border-radius: 8px;
  background: rgba(17, 24, 39, 0.92);
  box-shadow: 0 18px 40px rgba(25, 36, 64, 0.18);
  color: #fff;
  opacity: 0;
  padding: 12px 14px;
  pointer-events: none;
  transform: translateY(12px);
  transition: opacity 0.16s ease, transform 0.16s ease;
}

.toast.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.detail-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 0.44fr);
  gap: 18px;
}

.chart-panel {
  display: flex;
  flex-direction: column;
}

.detail-panel {
  overflow: hidden;
  padding: 20px;
}

.chart-wrap {
  position: relative;
  width: 100%;
  height: 340px;
}

.chart {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 10px 18px rgba(25, 36, 64, 0.03));
}

.axis-label {
  fill: #697586;
  font-size: 12px;
  font-weight: 650;
}

.chart-line {
  fill: none;
  stroke: var(--blue);
  stroke-width: 3.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.median-line {
  fill: none;
  stroke: #93a1b5;
  stroke-width: 2;
  stroke-dasharray: 5 5;
}

.max-line {
  fill: none;
  stroke: var(--pink);
  stroke-width: 2.4;
  stroke-dasharray: 8 6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.chart-dot {
  fill: #fff;
  stroke: var(--blue);
  stroke-width: 3.2;
}

.chart-hit {
  fill: transparent;
  cursor: crosshair;
  pointer-events: all;
}

.chart-tooltip {
  position: absolute;
  z-index: 2;
  min-width: 138px;
  border: 1px solid rgba(215, 222, 233, 0.92);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(12px);
  box-shadow: 0 16px 34px rgba(25, 36, 64, 0.16);
  color: var(--text);
  opacity: 0;
  pointer-events: none;
  transform: translateY(-8px);
  transition: opacity 0.12s ease, transform 0.12s ease;
}

.chart-tooltip.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.chart-tooltip strong,
.chart-tooltip span {
  display: block;
  padding: 0 12px;
}

.chart-tooltip strong {
  padding-top: 10px;
  font-size: 13px;
}

.chart-tooltip span {
  padding-top: 4px;
  color: var(--muted);
  font-size: 12px;
}

.chart-tooltip span:last-child {
  padding-bottom: 10px;
}

.score-list {
  display: grid;
  gap: 10px;
  grid-template-columns: 1fr;
  max-height: 340px;
  overflow: auto;
  padding-right: 4px;
  scrollbar-color: rgba(55, 114, 255, 0.45) rgba(234, 242, 255, 0.9);
  scrollbar-width: thin;
}

.score-list::-webkit-scrollbar {
  width: 10px;
}

.score-list::-webkit-scrollbar-track {
  border-radius: 999px;
  background: rgba(234, 242, 255, 0.9);
}

.score-list::-webkit-scrollbar-thumb {
  border: 2px solid rgba(234, 242, 255, 0.9);
  border-radius: 999px;
  background: linear-gradient(180deg, var(--blue), var(--pink));
}

.score-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: linear-gradient(180deg, #fff, var(--surface-soft));
  padding: 12px;
  transition: border-color 0.16s ease, box-shadow 0.16s ease;
}

.score-card:hover {
  border-color: rgba(37, 99, 235, 0.22);
  box-shadow: var(--shadow-soft);
}

.score-card strong {
  font-size: 15px;
  font-weight: 850;
}

.score-card small {
  color: var(--muted);
}

.score-value {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 0;
}

.score-card > div:last-child {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 96px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 12.5px;
}

.legend span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.legend i {
  width: 18px;
  height: 3px;
  border-radius: 999px;
  background: var(--blue);
}

.legend .median i {
  background: repeating-linear-gradient(90deg, #9aa5b5 0 6px, transparent 6px 10px);
}

.legend .max i {
  background: repeating-linear-gradient(90deg, var(--pink) 0 7px, transparent 7px 12px);
}

.empty-state {

function cloneStudent(student) {
  return { id: student.id, name: student.name, scores: [...student.scores] };

function compactNumber(value) {
  if (value === null || value === undefined || Number.isNaN(value)) return "-";
  return Number.isInteger(value) ? String(value) : value.toFixed(1);
}

function parseNumber(value) {
  if (value === null || value === undefined) return null;
  const text = String(value).trim();
  if (!text || text === "-") return null;
  const num = Number(text.replace(/,/g, ""));
  return Number.isFinite(num) ? num : null;
}

function median(values) {
  const nums = values.filter((value) => typeof value === "number").sort((a, b) => a - b);
  const middle = Math.floor(nums.length / 2);
  if (!nums.length) return null;
  return nums.length % 2 ? nums[middle] : (nums[middle - 1] + nums[middle]) / 2;
}

function pointFor(score) {
  if (typeof score !== "number") return 0;
  if (score >= 95) return 3;
  if (score >= 90) return 2;
  if (score >= 85) return 1;
  return 0;
}

function getStats() {
  const medians = tests.map((_, index) => median(rawStudents.map((student) => student.scores[index])));
  const maxScores = tests.map((_, index) => {
    const scores = rawStudents.map((student) => student.scores[index]).filter((score) => typeof score === "number" && Number.isFinite(score));
    return scores.length ? Math.max(...scores) : null;
  });
  const students = rawStudents.map((student) => {
    const validScores = student.scores.filter((score) => typeof score === "number");
    const totalPoints = student.scores.reduce((sum, score) => sum + pointFor(score), 0);
    const average = validScores.length ? validScores.reduce((sum, score) => sum + score, 0) / validScores.length : 0;
    const diffs = student.scores.map((score, index) => (typeof score === "number" ? score - medians[index] : null));
    return { ...student, totalPoints, average, diffs };
  });
  return { medians, maxScores, students: sortStudents(students) };
}

function sortStudents(students) {
  const sorted = [...students];
  if (sortMode === "points") {
    return sorted.sort((a, b) => b.totalPoints - a.totalPoints || b.average - a.average || a.id - b.id);
  }
  if (sortMode.startsWith("test-")) {
    const index = Number(sortMode.replace("test-", ""));
    return sorted.sort((a, b) => (b.scores[index] ?? -Infinity) - (a.scores[index] ?? -Infinity) || b.totalPoints - a.totalPoints || a.id - b.id);
  }
  return sorted.sort((a, b) => a.id - b.id || a.name.localeCompare(b.name, "zh-Hans-CN"));
}

function formatDiff(diff) {

  return `${diff > 0 ? "+" : ""}${compactNumber(diff)}`;

      body.scrollLeft += event.deltaX;
      header.scrollLeft = body.scrollLeft;
      event.preventDefault();
    },
    { passive: false },
  );
}

function matchesSearch(student) {
  const term = searchTerm.trim().toLowerCase();

}

function sortStudentsForRank(students) {
  return [...students].sort((a, b) => b.totalPoints - a.totalPoints || b.average - a.average || a.id - b.id);

function getTopQuartilePerformance(student, students) {
  const result = { count: 0, tests: [] };
  tests.forEach((test, index) => {
    const score = student.scores[index];
    if (typeof score !== "number" || !Number.isFinite(score)) return;
    const sortedScores = students
      .map((item) => item.scores[index])
      .filter((itemScore) => typeof itemScore === "number" && Number.isFinite(itemScore))
      .sort((a, b) => b - a);
    if (!sortedScores.length) return;
    const cutoffIndex = Math.max(0, Math.ceil(sortedScores.length * 0.25) - 1);
    const cutoff = sortedScores[cutoffIndex];
    if (score >= cutoff) {
      result.count += 1;
      result.tests.push(test);
    }
  });
  return result;
}

    </section>

      <div class="detail-panel chart-panel">

      <aside class="detail-panel">
        <div class="score-list">
          ${student.scores
            .map(
              (score, index) => `
              <div class="score-card">
                <div>
                  <strong>${escapeHtml(tests[index])}</strong>
                  <small>中位数 ${compactNumber(medians[index])} · 最高分 ${compactNumber(maxScores[index])} · ${scoreBand(score)}</small>
                </div>
                <div>
                  <div class="score-value">${compactNumber(score)}</div>

                </div>

  `, { ...options, compactNav: true });

  app.querySelector('[data-action="back"]').addEventListener("click", () => setStudent(null));
  app.querySelector('[data-action="share"]').addEventListener("click", () => shareStudentImage(student.name));

}

function trendChart(student, medians, maxScores) {
  const width = 860;
  const height = 340;
  const pad = { top: 24, right: 76, bottom: 62, left: 42 };
  const allValues = [...student.scores, ...medians, ...maxScores].filter((value) => typeof value === "number");
  const min = Math.max(60, Math.floor(Math.min(...allValues) / 5) * 5 - 5);
  const max = 100;
  const x = (index) => pad.left + (index / (tests.length - 1 || 1)) * (width - pad.left - pad.right);
  const y = (value) => pad.top + ((max - value) / (max - min)) * (height - pad.top - pad.bottom);
  const lineFor = (values) =>
    values
      .map((value, index) => (typeof value === "number" ? `${index === 0 ? "M" : "L"} ${x(index).toFixed(1)} ${y(value).toFixed(1)}` : ""))
      .filter(Boolean)
      .join(" ");

  const grid = [60, 70, 80, 90, 100]
    .filter((tick) => tick >= min)
    .map(
      (tick) => `
      <line x1="${pad.left}" x2="${width - pad.right}" y1="${y(tick)}" y2="${y(tick)}" stroke="#edf1f6" />
      <text class="axis-label" x="8" y="${y(tick) + 4}">${tick}</text>
    `,
    )
    .join("");

  const dots = student.scores
    .map((score, index) => {
      if (typeof score !== "number") return "";
      return `<circle class="chart-dot" cx="${x(index)}" cy="${y(score)}" r="5"><title>${escapeHtml(tests[index])}：成绩 ${compactNumber(score)}，中位数 ${compactNumber(medians[index])}</title></circle>`;
    })
    .join("");

  const hitAreas = student.scores
    .map((score, index) => {
      const left = index === 0 ? pad.left : (x(index - 1) + x(index)) / 2;
      const right = index === tests.length - 1 ? width - pad.right : (x(index) + x(index + 1)) / 2;
      const diff = typeof score === "number" && typeof medians[index] === "number" ? score - medians[index] : null;
      return `
        <rect class="chart-hit"
          x="${left.toFixed(1)}"
          y="${pad.top}"
          width="${(right - left).toFixed(1)}"
          height="${height - pad.top - pad.bottom}"
          data-test="${escapeHtml(tests[index])}"
          data-score="${compactNumber(score)}"
          data-median="${compactNumber(medians[index])}"
          data-max="${compactNumber(maxScores[index])}"
          data-diff="${formatDiff(diff)}" />
      `;
    })
    .join("");

  const labels = tests
    .map((test, index) => `<text class="axis-label" text-anchor="middle" x="${x(index)}" y="${height - 24}">${escapeHtml(test)}</text>`)
    .join("");

  return `
    <svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(student.name)}成绩动态图">
      <rect x="0" y="0" width="${width}" height="${height}" rx="8" fill="#ffffff" />
      ${grid}
      <path class="max-line" d="${lineFor(maxScores)}" />
      <path class="median-line" d="${lineFor(medians)}" />
      <path class="chart-line" d="${lineFor(student.scores)}" />
      ${dots}
      ${hitAreas}
      ${labels}
    </svg>
  `;
}

function bindChartTooltip() {
  const wrap = app.querySelector(".chart-wrap");
  const tooltip = app.querySelector(".chart-tooltip");
  if (!wrap || !tooltip) return;

  wrap.querySelectorAll(".chart-hit").forEach((area) => {
    const show = (event) => {
      const rect = wrap.getBoundingClientRect();
      tooltip.innerHTML = `
        <strong>${escapeHtml(area.dataset.test)}</strong>
        <span>成绩 ${escapeHtml(area.dataset.score)}</span>
        <span>中位数 ${escapeHtml(area.dataset.median)}</span>
        <span>最高分 ${escapeHtml(area.dataset.max)}</span>
        <span>差值 ${escapeHtml(area.dataset.diff)}</span>
      `;
      tooltip.style.left = `${Math.min(Math.max(event.clientX - rect.left + 12, 8), rect.width - tooltip.offsetWidth - 8)}px`;
      tooltip.style.top = `${Math.min(Math.max(event.clientY - rect.top - 16, 8), rect.height - tooltip.offsetHeight - 8)}px`;
      tooltip.classList.add("is-visible");
    };
    area.addEventListener("mousemove", show);
    area.addEventListener("mouseenter", show);
    area.addEventListener("click", show);
    area.addEventListener("touchstart", (event) => {
      show(event.touches[0]);
    });
    area.addEventListener("mouseleave", () => tooltip.classList.remove("is-visible"));
  });
}

async function shareStudentImage(studentName) {
  const { medians, maxScores, students } = getStats();
  const student = students.find((item) => item.name === studentName);
  if (!student) return;
  const shareButton = app.querySelector('[data-action="share"]');
  if (shareButton) shareButton.disabled = true;
  showToast("正在生成分享图片...");
  try {
    const blob = await createStudentShareBlob(student, medians, maxScores, students);
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      showToast("分享图片已复制；也可以用“复制个人链接”单独分享页面。");
    } else {
      downloadBlob(blob, `${student.name}成绩分享.png`);
      showToast("当前浏览器不支持自动复制图片，已为你下载分享图。");
    }
  } catch (error) {
    try {
      const blob = await createStudentShareBlob(student, medians, maxScores, students);
      downloadBlob(blob, `${student.name}成绩分享.png`);
      showToast("浏览器限制了自动复制，已改为下载分享图。");
    } catch (downloadError) {
      showToast("生成分享图失败，请换用 Chrome 或 Edge 再试。");
    }
  } finally {
    if (shareButton) shareButton.disabled = false;
  }
}

async function copyStudentLink(studentName) {
  const url = `${location.origin}${location.pathname}#student=${encodeURIComponent(studentName)}`;
  try {
    await navigator.clipboard.writeText(url);
    showToast("个人页面链接已复制，可以直接粘贴发送。");
  } catch (error) {
    showToast("当前浏览器限制自动复制，请在地址栏复制这个学生页面链接。");
  }
}

function showToast(message) {
  const toast = app.querySelector(".toast");
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add("is-visible");
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(() => {
    toast.classList.remove("is-visible");
  }, 2600);
}

function createStudentShareBlob(student, medians, maxScores, students) {
  const validScores = student.scores
    .map((score, index) => ({ score, test: tests[index], diff: student.diffs[index], median: medians[index], maxScore: maxScores[index] }))
    .filter((item) => typeof item.score === "number" && Number.isFinite(item.score));
  const bestScore = validScores.reduce((best, item) => (item.score > best.score ? item : best), validScores[0] || { score: null, test: "-" });
  const positiveDiffs = student.diffs.filter((diff) => typeof diff === "number" && diff > 0).length;
  const topQuartilePerformance = getTopQuartilePerformance(student, students);
  const width = 1080;
  const scoreRows = Math.ceil(validScores.length / 2);
  const height = Math.max(1340, 1040 + scoreRows * 104);
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");

  drawShareBackground(ctx, width, height);
  drawShareHeader(ctx, student, width);
  drawShareMetrics(ctx, [
    ["总积分", student.totalPoints],
    ["总均分", compactNumber(student.average)],
    ["最高分", compactNumber(bestScore.score)],
    ["高于中位数", `${positiveDiffs}次`],
    ["最佳表现次数", `${topQuartilePerformance.count}次`],
  ]);
  drawSharePerformanceNote(ctx, topQuartilePerformance.count, validScores.length, 70, 376, 940);
  drawShareChart(ctx, student, medians, maxScores, 70, 420, 940, 360);
  drawShareScores(ctx, validScores, 70, 855, 940);
  drawShareFooter(ctx, width, height);

  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => {
      if (blob) resolve(blob);
      else reject(new Error("Canvas export failed"));
    }, "image/png");
  });
}

function drawShareBackground(ctx, width, height) {
  const bg = ctx.createLinearGradient(0, 0, width, height);
  bg.addColorStop(0, "#fff8fc");
  bg.addColorStop(0.45, "#f7fbff");
  bg.addColorStop(1, "#f3fff9");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, width, height);
  drawCircle(ctx, 90, 80, 250, "rgba(255, 79, 163, 0.20)");
  drawCircle(ctx, 980, 115, 260, "rgba(0, 184, 169, 0.16)");
  drawCircle(ctx, 910, height - 150, 300, "rgba(139, 92, 246, 0.12)");
  roundRect(ctx, 40, 40, width - 80, height - 80, 28);
  ctx.fillStyle = "rgba(255, 255, 255, 0.82)";
  ctx.fill();
  ctx.strokeStyle = "rgba(215, 222, 233, 0.9)";
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawShareHeader(ctx, student, width) {
  const accent = ctx.createLinearGradient(64, 64, width - 64, 64);
  accent.addColorStop(0, "#3772ff");
  accent.addColorStop(0.45, "#ff4fa3");
  accent.addColorStop(0.72, "#ffd166");
  accent.addColorStop(1, "#00b8a9");
  roundRect(ctx, 64, 64, width - 128, 8, 4);
  ctx.fillStyle = accent;
  ctx.fill();

  ctx.fillStyle = "#111827";
  ctx.font = font(900, 58);
  ctx.fillText(`${student.id}号 ${student.name}`, 76, 160);
  ctx.fillStyle = "#667085";
  ctx.font = font(650, 25);
  ctx.fillText("个人成绩动态分享卡", 78, 210);
}

function drawShareMetrics(ctx, metrics) {
  const x = 70;
  const y = 255;
  const gap = 14;
  const cardWidth = (940 - gap * 4) / 5;
  metrics.forEach(([label, value], index) => {
    const left = x + index * (cardWidth + gap);
    const fills = ["#eaf2ff", "#ffe8f3", "#f0eaff", "#ddfbf7", "#fff6dc"];
    roundRect(ctx, left, y, cardWidth, 104, 18);
    ctx.fillStyle = fills[index % fills.length];
    ctx.fill();
    ctx.strokeStyle = "rgba(215, 222, 233, 0.85)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#667085";
    ctx.font = font(700, 20);
    ctx.fillText(label, left + 18, y + 34);
    ctx.fillStyle = "#111827";
    ctx.font = font(900, 34);
    ctx.fillText(String(value), left + 18, y + 78);
  });
}

function drawSharePerformanceNote(ctx, count, total, left, top, width) {
  roundRect(ctx, left, top, width, 26, 13);
  ctx.fillStyle = "rgba(234, 242, 255, 0.78)";
  ctx.fill();
  ctx.fillStyle = "#536074";
  ctx.font = font(650, 17);
  ctx.fillText(`最佳表现次数 ${count}次：每次考试进入班级前25%计为1次，用来衡量不同难度考试中的相对表现。`, left + 18, top + 18);
}

function drawShareChart(ctx, student, medians, maxScores, left, top, width, height) {
  roundRect(ctx, left, top, width, height, 22);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.strokeStyle = "#e3e8f0";
  ctx.stroke();

  const pad = { left: 54, right: 64, top: 42, bottom: 74 };
  const values = [...student.scores, ...medians, ...maxScores].filter((value) => typeof value === "number" && Number.isFinite(value));
  const min = Math.max(60, Math.floor(Math.min(...values) / 5) * 5 - 5);
  const max = 100;
  const plotLeft = left + pad.left;
  const plotRight = left + width - pad.right;
  const plotTop = top + pad.top;
  const plotBottom = top + height - pad.bottom;
  const x = (index) => plotLeft + (index / (tests.length - 1 || 1)) * (plotRight - plotLeft);
  const y = (value) => plotTop + ((max - value) / (max - min)) * (plotBottom - plotTop);
  const titleX = left + 52;

  ctx.fillStyle = "#111827";
  ctx.font = font(800, 24);
  ctx.fillText("成绩动态图", titleX, top + 35);
  ctx.font = font(600, 17);
  ctx.fillStyle = "#667085";
  ctx.fillText("蓝线为个人成绩，灰线为班级中位数，粉线为班级最高分", titleX + 128, top + 35);

  [60, 70, 80, 90, 100].filter((tick) => tick >= min).forEach((tick) => {
    ctx.strokeStyle = "#edf1f6";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(plotLeft, y(tick));
    ctx.lineTo(plotRight, y(tick));
    ctx.stroke();
    ctx.fillStyle = "#697586";
    ctx.font = font(650, 16);
    ctx.fillText(String(tick), left + 18, y(tick) + 5);
  });

  drawLine(ctx, maxScores, x, y, "#ff4fa3", 3.5, [14, 8]);
  drawLine(ctx, medians, x, y, "#93a1b5", 3, [10, 10]);
  drawLine(ctx, student.scores, x, y, "#3772ff", 6);
  student.scores.forEach((score, index) => {
    if (typeof score !== "number") return;
    ctx.beginPath();
    ctx.arc(x(index), y(score), 7, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.strokeStyle = "#3772ff";
    ctx.lineWidth = 4;
    ctx.stroke();
  });

  tests.forEach((test, index) => {
    ctx.fillStyle = "#697586";
    ctx.font = font(650, 16);
    ctx.textAlign = "center";
    ctx.fillText(truncateText(ctx, test, 82), x(index), top + height - 30);
  });
  ctx.textAlign = "left";
}

function drawShareScores(ctx, validScores, left, top, width) {
  ctx.fillStyle = "#111827";
  ctx.font = font(850, 28);
  ctx.fillText("成绩明细", left, top - 22);
  const gap = 14;
  const cardWidth = (width - gap) / 2;
  const cardHeight = 88;
  validScores.forEach((item, index) => {
    const col = index % 2;
    const row = Math.floor(index / 2);
    const x = left + col * (cardWidth + gap);
    const y = top + row * (cardHeight + 14);
    roundRect(ctx, x, y, cardWidth, cardHeight, 18);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.strokeStyle = "#e3e8f0";
    ctx.stroke();
    ctx.fillStyle = "#111827";
    ctx.font = font(850, 24);
    ctx.fillText(truncateText(ctx, item.test, 210), x + 20, y + 34);
    ctx.fillStyle = "#667085";
    ctx.font = font(650, 18);
    ctx.fillText(`中位数 ${compactNumber(item.median)} · 最高分 ${compactNumber(item.maxScore)}`, x + 20, y + 64);
    ctx.textAlign = "right";
    ctx.fillStyle = "#111827";
    ctx.font = font(900, 30);
    ctx.fillText(compactNumber(item.score), x + cardWidth - 22, y + 36);
    ctx.fillStyle = item.diff > 0 ? "#ef4444" : item.diff < 0 ? "#12a150" : "#667085";
    ctx.font = font(850, 20);
    ctx.fillText(formatDiff(item.diff), x + cardWidth - 22, y + 66);
    ctx.textAlign = "left";
  });
}

function drawShareFooter(ctx, width, height) {
  ctx.fillStyle = "#667085";
  ctx.font = font(650, 20);
  ctx.textAlign = "center";
  ctx.fillText("数据来自全班成绩总览 · 红色为高于中位数，绿色为低于中位数", width / 2, height - 70);
  ctx.textAlign = "left";
}

function drawLine(ctx, values, x, y, color, lineWidth, dash = []) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.setLineDash(dash);
  ctx.beginPath();
  let started = false;
  values.forEach((value, index) => {
    if (typeof value !== "number" || !Number.isFinite(value)) return;
    if (!started) {
      ctx.moveTo(x(index), y(value));
      started = true;
    } else {
      ctx.lineTo(x(index), y(value));
    }
  });
  ctx.stroke();
  ctx.restore();
}

function drawCircle(ctx, x, y, radius, color) {
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

function roundRect(ctx, x, y, width, height, radius) {
  const r = Math.min(radius, width / 2, height / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + width, y, x + width, y + height, r);
  ctx.arcTo(x + width, y + height, x, y + height, r);
  ctx.arcTo(x, y + height, x, y, r);
  ctx.arcTo(x, y, x + width, y, r);
  ctx.closePath();
}

function truncateText(ctx, text, maxWidth) {
  const value = String(text);
  if (ctx.measureText(value).width <= maxWidth) return value;
  let output = value;
  while (output.length > 1 && ctx.measureText(`${output}...`).width > maxWidth) {
    output = output.slice(0, -1);
  }
  return `${output}...`;
}

function font(weight, size) {
  return `${weight} ${size}px Inter, "SF Pro Display", "HarmonyOS Sans SC", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif`;
}

function exportExcel() {
  const { medians, students } = getStats();
  const rows = [
    ["学号", "姓名", "总积分", "总均分", ...tests.flatMap((test) => [`${test}成绩`, `${test}差值`])],
    ...students
      .slice()
      .sort((a, b) => a.id - b.id)
      .map((student) => [
        student.id,
        student.name,
        student.totalPoints,
        Number(student.average.toFixed(1)),
        ...student.scores.flatMap((score, index) => [
          score === null ? "" : score,
          styledDiffCell(typeof score === "number" ? score - medians[index] : null),
        ]),
      ]),
  ];
  const blob = createXlsxBlob(rows);
  downloadBlob(blob, "成绩导出.xlsx");
}

function styledDiffCell(diff) {
  if (diff === null) return "";
  const value = formatDiff(diff);
  if (diff > 0) return { value, style: 2 };
  if (diff < 0) return { value, style: 3 };
  return value;
}

function createXlsxBlob(rows) {
  const files = new Map([
    ["[Content_Types].xml", contentTypesXml()],
    ["_rels/.rels", rootRelsXml()],
    ["xl/workbook.xml", workbookXml()],
    ["xl/_rels/workbook.xml.rels", workbookRelsXml()],
    ["xl/styles.xml", stylesXml()],
    ["xl/worksheets/sheet1.xml", sheetXml(rows)],
  ]);
  return new Blob([zipFiles(files)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

function contentTypesXml() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
  <Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
  <Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`;
}

function rootRelsXml() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;
}

function workbookXml() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <sheets>
    <sheet name="成绩" sheetId="1" r:id="rId1"/>
  </sheets>
</workbook>`;
}

function workbookRelsXml() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
  <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;
}

function stylesXml() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <fonts count="4">
    <font><sz val="11"/><name val="Arial"/></font>
    <font><b/><sz val="11"/><name val="Arial"/></font>
    <font><b/><sz val="11"/><color rgb="FFD93025"/><name val="Arial"/></font>
    <font><b/><sz val="11"/><color rgb="FF168A46"/><name val="Arial"/></font>
  </fonts>
  <fills count="4">
    <fill><patternFill patternType="none"/></fill>
    <fill><patternFill patternType="gray125"/></fill>
    <fill><patternFill patternType="solid"><fgColor rgb="FFFFF0EE"/><bgColor indexed="64"/></patternFill></fill>
    <fill><patternFill patternType="solid"><fgColor rgb="FFECF9F1"/><bgColor indexed="64"/></patternFill></fill>
  </fills>
  <borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
  <cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
  <cellXfs count="4">
    <xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
    <xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>
    <xf numFmtId="0" fontId="2" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>
    <xf numFmtId="0" fontId="3" fillId="3" borderId="0" xfId="0" applyFont="1" applyFill="1"/>
  </cellXfs>
  <cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;
}

function sheetXml(rows) {
  const columnCount = Math.max(...rows.map((row) => row.length), 1);
  const columns = Array.from({ length: columnCount }, (_, index) => `<col min="${index + 1}" max="${index + 1}" width="${index < 2 ? 12 : 14}" customWidth="1"/>`).join("");
  const rowXml = rows
    .map((row, rowIndex) => {
      const cells = row
        .map((cell, colIndex) => cellXml(cell, rowIndex + 1, colIndex, rowIndex === 0))
        .join("");
      return `<row r="${rowIndex + 1}">${cells}</row>`;
    })
    .join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <cols>${columns}</cols>
  <sheetData>${rowXml}</sheetData>
</worksheet>`;
}

function cellXml(cell, rowNumber, colIndex, isHeader) {
  const ref = `${columnName(colIndex + 1)}${rowNumber}`;
  const value = cell && typeof cell === "object" && "value" in cell ? cell.value : cell;
  const styleId = isHeader ? 1 : cell && typeof cell === "object" ? cell.style : null;
  const style = styleId ? ` s="${styleId}"` : "";
  if (typeof value === "number" && Number.isFinite(value)) {
    return `<c r="${ref}"${style}><v>${value}</v></c>`;
  }
  const text = escapeXml(value ?? "");
  return `<c r="${ref}" t="inlineStr"${style}><is><t>${text}</t></is></c>`;
}

function columnName(number) {
  let output = "";
  for (let current = number; current > 0; current = Math.floor((current - 1) / 26)) {
    output = String.fromCharCode(((current - 1) % 26) + 65) + output;
  }
  return output;
}

function escapeXml(value) {
  return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" })[char]);
}

function zipFiles(files) {
  const encoder = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  for (const [name, content] of files) {
    const nameBytes = encoder.encode(name);
    const data = encoder.encode(content);
    const crc = crc32(data);
    chunks.push(zipLocalHeader(nameBytes, data, crc), data);
    central.push(zipCentralHeader(nameBytes, data, crc, offset));
    offset += 30 + nameBytes.length + data.length;
  }
  const centralOffset = offset;
  const centralSize = central.reduce((sum, chunk) => sum + chunk.length, 0);
  return new Blob([...chunks, ...central, zipEndRecord(files.size, centralSize, centralOffset)]);
}

function zipLocalHeader(nameBytes, data, crc) {
  const header = new Uint8Array(30 + nameBytes.length);
  const view = new DataView(header.buffer);
  view.setUint32(0, 0x04034b50, true);
  view.setUint16(4, 20, true);
  view.setUint16(6, 0, true);
  view.setUint16(8, 0, true);
  view.setUint32(14, crc, true);
  view.setUint32(18, data.length, true);
  view.setUint32(22, data.length, true);
  view.setUint16(26, nameBytes.length, true);
  header.set(nameBytes, 30);
  return header;
}

function zipCentralHeader(nameBytes, data, crc, offset) {
  const header = new Uint8Array(46 + nameBytes.length);
  const view = new DataView(header.buffer);
  view.setUint32(0, 0x02014b50, true);
  view.setUint16(4, 20, true);
  view.setUint16(6, 20, true);
  view.setUint16(8, 0, true);
  view.setUint16(10, 0, true);
  view.setUint32(16, crc, true);
  view.setUint32(20, data.length, true);
  view.setUint32(24, data.length, true);
  view.setUint16(28, nameBytes.length, true);
  view.setUint32(42, offset, true);
  header.set(nameBytes, 46);
  return header;
}

function zipEndRecord(count, centralSize, centralOffset) {
  const header = new Uint8Array(22);
  const view = new DataView(header.buffer);
  view.setUint32(0, 0x06054b50, true);
  view.setUint16(8, count, true);
  view.setUint16(10, count, true);
  view.setUint32(12, centralSize, true);
  view.setUint32(16, centralOffset, true);
  return header;
}

function crc32(data) {
  let crc = 0xffffffff;
  for (const byte of data) {
    crc ^= byte;
    for (let index = 0; index < 8; index += 1) {
      crc = crc & 1 ? (crc >>> 1) ^ 0xedb88320 : crc >>> 1;
    }
  }
  return (crc ^ 0xffffffff) >>> 0;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.append(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

async function importExcel(event) {
  const file = event.target.files[0];
  event.target.value = "";
  if (!file) return;
  const rows = /\.xlsx$/i.test(file.name) ? await parseXlsx(file) : parseTextWorkbook(await file.text(), file.name);
  const imported = normalizeImportedRows(rows);
  if (!imported.students.length) {
    alert("没有识别到有效成绩数据。请使用列：学号、姓名、各次考试成绩。");
    return;
  }
  tests = imported.tests;
  rawStudents = imported.students;
  sortMode = "id";
  searchTerm = "";
  setStudent(null);
}

function parseTextWorkbook(text, filename) {
  return /\.csv$/i.test(filename) ? parseCsv(text) : parseTableText(text);
}

function parseTableText(text) {
  if (/<table[\s>]/i.test(text)) {
    const doc = new DOMParser().parseFromString(text, "text/html");
    const tableRows = [...doc.querySelectorAll("tr")];
    return tableRows.map((row) => [...row.children].map((cell) => cell.textContent.trim()));
  }
  return parseCsv(text);
}

async function parseXlsx(file) {
  if (!("DecompressionStream" in window)) {
    alert("当前浏览器不支持静态解析 .xlsx，请改用导出的 .xls 或另存为 CSV 后导入。");
    return [];
  }
  const entries = await unzipXlsx(await file.arrayBuffer());
  const workbookXml = entries.get("xl/workbook.xml");
  const relsXml = entries.get("xl/_rels/workbook.xml.rels");
  if (!workbookXml || !relsXml) return [];
  const parser = new DOMParser();
  const workbook = parser.parseFromString(workbookXml, "application/xml");
  const rels = parser.parseFromString(relsXml, "application/xml");
  const firstSheet = workbook.querySelector("sheet");
  const relId = firstSheet?.getAttribute("r:id");
  const rel = [...rels.querySelectorAll("Relationship")].find((item) => item.getAttribute("Id") === relId);
  const target = rel?.getAttribute("Target") || "worksheets/sheet1.xml";
  const sheetPath = target.startsWith("/") ? target.slice(1) : `xl/${target.replace(/^xl\//, "")}`;
  const sheetXml = entries.get(sheetPath);
  if (!sheetXml) return [];
  const sharedStrings = parseSharedStrings(entries.get("xl/sharedStrings.xml") || "");
  return parseSheetXml(sheetXml, sharedStrings);
}

async function unzipXlsx(buffer) {
  const bytes = new Uint8Array(buffer);
  const view = new DataView(buffer);
  const eocdOffset = findEndOfCentralDirectory(view);
  if (eocdOffset < 0) throw new Error("Invalid xlsx file");
  const entryCount = view.getUint16(eocdOffset + 10, true);
  const centralOffset = view.getUint32(eocdOffset + 16, true);
  const decoder = new TextDecoder();
  const entries = new Map();
  let offset = centralOffset;
  for (let i = 0; i < entryCount; i += 1) {
    if (view.getUint32(offset, true) !== 0x02014b50) break;
    const method = view.getUint16(offset + 10, true);
    const compressedSize = view.getUint32(offset + 20, true);
    const fileNameLength = view.getUint16(offset + 28, true);
    const extraLength = view.getUint16(offset + 30, true);
    const commentLength = view.getUint16(offset + 32, true);
    const localOffset = view.getUint32(offset + 42, true);
    const fileName = decoder.decode(bytes.slice(offset + 46, offset + 46 + fileNameLength));
    const localNameLength = view.getUint16(localOffset + 26, true);
    const localExtraLength = view.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + localNameLength + localExtraLength;
    const compressed = bytes.slice(dataStart, dataStart + compressedSize);
    const content = method === 0 ? compressed : await inflateRaw(compressed);
    entries.set(fileName, decoder.decode(content));
    offset += 46 + fileNameLength + extraLength + commentLength;
  }
  return entries;
}

function findEndOfCentralDirectory(view) {
  for (let offset = view.byteLength - 22; offset >= Math.max(0, view.byteLength - 66000); offset -= 1) {
    if (view.getUint32(offset, true) === 0x06054b50) return offset;
  }
  return -1;
}

async function inflateRaw(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function parseSharedStrings(xml) {
  if (!xml) return [];
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  return [...doc.querySelectorAll("si")].map((si) => [...si.querySelectorAll("t")].map((t) => t.textContent).join(""));
}

function parseSheetXml(xml, sharedStrings) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const rows = [];
  doc.querySelectorAll("sheetData row").forEach((row) => {
    const output = [];
    row.querySelectorAll("c").forEach((cell) => {
      const col = columnIndex(cell.getAttribute("r") || "");
      const type = cell.getAttribute("t");
      let value = "";
      if (type === "inlineStr") {
        value = [...cell.querySelectorAll("is t")].map((item) => item.textContent).join("");
      } else {
        value = cell.querySelector("v")?.textContent ?? "";
        if (type === "s") value = sharedStrings[Number(value)] ?? "";
      }
      output[col] = value;
    });
    rows.push(output.map((cell) => cell ?? ""));
  });
  return rows;
}

function columnIndex(ref) {
  const letters = ref.replace(/[^A-Z]/g, "");
  return [...letters].reduce((sum, letter) => sum * 26 + letter.charCodeAt(0) - 64, 0) - 1;
}

function parseCsv(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;
  for (let index = 0; index < text.length; index += 1) {
    const char = text[index];
    const next = text[index + 1];
    if (char === '"' && quoted && next === '"') {
      cell += '"';
      index += 1;
    } else if (char === '"') {
      quoted = !quoted;
    } else if (char === "," && !quoted) {
      row.push(cell.trim());
      cell = "";
    } else if ((char === "\n" || char === "\r") && !quoted) {
      if (char === "\r" && next === "\n") index += 1;
      row.push(cell.trim());
      if (row.some(Boolean)) rows.push(row);
      row = [];
      cell = "";
    } else {
      cell += char;
    }
  }
  row.push(cell.trim());
  if (row.some(Boolean)) rows.push(row);
  return rows;
}

function normalizeImportedRows(rows) {
  const cleanRows = rows.filter((row) => row.some((cell) => String(cell ?? "").trim()));
  const headerIndex = cleanRows.findIndex((row) => row.some((cell) => /学号|序号/i.test(String(cell))) || row.some((cell) => /姓名/.test(String(cell))));
  const header = headerIndex >= 0 ? cleanRows[headerIndex] : [];
  const body = headerIndex >= 0 ? cleanRows.slice(headerIndex + 1) : cleanRows;
  const detectedNameIndex = detectNameIndex(body);
  const detectedIdIndex = detectIdIndex(body, detectedNameIndex);
  const idIndex = Math.max(0, header.findIndex((cell) => /学号|序号/i.test(String(cell))));
  const nameHeaderIndex = header.findIndex((cell) => /姓名/.test(String(cell)));
  const nameIndex = nameHeaderIndex >= 0 ? nameHeaderIndex : detectedNameIndex;
  const finalIdIndex = idIndex >= 0 ? idIndex : detectedIdIndex;
  const scoreIndexes = detectScoreIndexes(body, finalIdIndex, nameIndex, header).map((index, order) => ({
    cell: cleanTestName(String(header[index] || defaultTests[order] || `第${order + 1}次`).trim()),
    index,
  }));
  const nextTests = scoreIndexes.map(({ cell }, index) => cell || `第${index + 1}次`);
  const nextStudents = body
    .map((row, index) => {
      const id = parseNumber(row[finalIdIndex]) ?? index + 1;
      const name = String(row[nameIndex] ?? "").trim();
      const scores = scoreIndexes.map(({ index: scoreIndex }) => parseNumber(row[scoreIndex]));
      return name ? { id, name, scores } : null;
    })
    .filter(Boolean);
  return { tests: nextTests, students: nextStudents };
}

function detectNameIndex(rows) {
  const maxCols = Math.max(...rows.map((row) => row.length), 0);
  let best = 1;
  let bestCount = -1;
  for (let col = 0; col < maxCols; col += 1) {
    const count = rows.filter((row) => {
      const value = String(row[col] ?? "").trim();
      return value && parseNumber(value) === null;
    }).length;
    if (count > bestCount) {
      best = col;
      bestCount = count;
    }
  }
  return best;
}

function detectIdIndex(rows, nameIndex) {
  const maxCols = Math.max(...rows.map((row) => row.length), 0);
  for (let col = 0; col < maxCols; col += 1) {
    if (col === nameIndex) continue;
    const values = rows.map((row) => parseNumber(row[col])).filter((value) => value !== null);
    if (values.length >= Math.min(10, rows.length) && values.every((value) => Number.isInteger(value) && value >= 0 && value <= 100)) return col;
  }
  return 0;
}

function cleanTestName(name) {
  return name.replace(/成绩$/, "") || name;
}

function detectScoreIndexes(rows, idIndex, nameIndex, header = []) {
  const maxCols = Math.max(...rows.map((row) => row.length), 0);
  const indexes = [];
  for (let col = 0; col < maxCols; col += 1) {
    if (col === idIndex || col === nameIndex) continue;
    const label = String(header[col] ?? "").trim();
    if (/总积分|总均分|均分|平均分|差值|中位数/i.test(label)) continue;
    const values = rows.map((row) => parseNumber(row[col])).filter((value) => value !== null);
    if (values.length >= Math.max(2, Math.floor(rows.length * 0.45)) && values.every((value) => value >= 0 && value <= 150)) indexes.push(col);
  }
  return indexes;
}

function render(options = {}) {
  const studentName = currentStudentName();
  if (studentName) {
    renderStudent(studentName, options);
  } else {
    overview(options);
  }
}

window.addEventListener("hashchange", render);
render();

</script>
